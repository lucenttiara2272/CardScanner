<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1a17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Centering Gauge</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Base colours only, so there is no pale flash before app.js paints. -->
<style>
  html,body { margin:0; background:#1b1a17; color:#ece7db;
    font-family:"Archivo", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  #boot { padding:22px 18px; font-size:13px; color:#8b857a; }
</style>

<body>
<div id="boot">Loading\u2026</div>

<script>
  /* Everything - styles, markup and logic - lives in app.js, so this file
     never needs changing again. The timestamp defeats GitHub Pages caching,
     which otherwise serves a stale script after an upload. */
  var s = document.createElement('script');
  s.src = 'app.js?t=' + Date.now();
  s.onerror = function () {
    document.getElementById('boot').textContent =
      'Could not load app.js - check it sits beside index.html in the repo.';
  };
  document.body.appendChild(s);
</script>
